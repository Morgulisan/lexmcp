services:
  gateway:
    image: node:22-slim
    command: [node, /app/gateway.mjs]
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
      - ./secrets:/run/secrets:ro
    environment:
      GATEWAY_CONFIG: /run/secrets/gateway.json
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
